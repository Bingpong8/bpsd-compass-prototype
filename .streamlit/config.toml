[theme]
# สีหลักสำหรับองค์ประกอบไฮไลต์ เช่น ขีดใต้เมนู หรือปุ่มสำคัญ (ใช้สีดำเข้ม)
primaryColor = "#000000"

# สีพื้นหลังหลักของหน้าเว็บ (สีขาวสะอาดสไตล์ Brutalism)
backgroundColor = "#FFFFFF"

# สีพื้นหลังของชิ้นส่วนย่อย เช่น Sidebar, กล่องกรอกข้อมูล หรือแถบตาราง (สีเทาอ่อนแบบดิบๆ)
secondaryBackgroundColor = "#F2F2F2"

# สีของตัวอักษรทั้งหมดบนหน้าเว็บ (สีดำสนิทเพื่อสร้าง High Contrast)
textColor = "#000000"

# ฟอนต์พื้นฐานของระบบ (แนะนำเป็น sans serif เพื่อความโมเดิร์นและเรียบง่าย)
font = "sans serif"
