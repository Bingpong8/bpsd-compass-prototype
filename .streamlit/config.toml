[theme]
# สีหลักสำหรับองค์ประกอบไฮไลต์ เช่น ขีดใต้เมนู หรือปุ่มสำคัญ (ใช้สีขาวสว่าง)
primaryColor = "#FFFFFF"

# สีพื้นหลังหลักของหน้าเว็บ (สีดำสนิทสไตล์ Brutalism Dark)
backgroundColor = "#000000"

# สีพื้นหลังของชิ้นส่วนย่อย เช่น Sidebar หรือกล่องอินพุต (สีเทาเข้มมากแบบดิบๆ)
secondaryBackgroundColor = "#111111"

# สีของตัวอักษรทั้งหมดบนหน้าเว็บ (สีขาวเพื่อให้ตัดกับพื้นหลังชัดเจน)
textColor = "#FFFFFF"

# ฟอนต์พื้นฐานของระบบ 
font = "sans serif"

[client]
# บังคับล็อกให้แสดงผลเป็นโหมดมืด (Dark Mode) เสมอ โดยอิงตามคู่สีด้านบน
theme = "dark"
